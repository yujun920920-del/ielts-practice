<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IELTS Practice</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1a3c5e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="IELTS" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .stats-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:32px; }
    .stat-card { background:white; border-radius:10px; padding:18px 16px; text-align:center; box-shadow:0 1px 6px rgba(0,0,0,0.07); }
    .stat-number { font-size:28px; font-weight:700; color:#1a3c5e; margin-bottom:4px; }
    .stat-label { font-size:12px; color:#999; }
    .daily-bar-wrap { background:white; border-radius:10px; padding:16px 18px; margin-bottom:32px; box-shadow:0 1px 6px rgba(0,0,0,0.07); }
    .daily-bar-header { display:flex; justify-content:space-between; font-size:13px; margin-bottom:8px; }
    .daily-bar-track { background:#e8f0fb; border-radius:8px; height:10px; overflow:hidden; }
    .daily-bar-fill { height:100%; background:#1a3c5e; border-radius:8px; transition:width 0.4s; }
    @media(max-width:500px){ .stats-grid{ grid-template-columns:1fr 1fr; } }
  </style>

  <script>
    // Dark mode
    (function(){
      const dark = localStorage.getItem('ielts_dark') === '1';
      if (dark) document.body.classList.add('dark');
    })();
    function toggleDark() {
      document.body.classList.toggle('dark');
      localStorage.setItem('ielts_dark', document.body.classList.contains('dark') ? '1' : '0');
      document.getElementById('dark-btn').textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
    }
  </script>
</head>
<body>
  <header>
    <h1>IELTS Practice</h1>
    <button id="dark-btn" onclick="toggleDark()" style="margin-left:auto;background:rgba(255,255,255,0.15);border:none;color:white;font-size:18px;cursor:pointer;padding:4px 10px;border-radius:8px;" title="深色模式">🌙</button>
  </header>

  <div class="container">
    <div class="hero">
      <h2>選擇練習模組</h2>
      <p>點擊下方模組開始練習，祝你考試順利！</p>
    </div>

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-number" id="stat-practiced">0</div>
        <div class="stat-label">已練單字數</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="stat-accuracy">—</div>
        <div class="stat-label">拼字正確率</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="stat-errors">0</div>
        <div class="stat-label">錯誤單字數</div>
      </div>
    </div>

    <!-- Daily goal -->
    <div class="daily-bar-wrap">
      <div class="daily-bar-header">
        <span style="font-weight:600;color:#555;">今日學習進度</span>
        <span id="daily-label" style="color:#1a3c5e;font-weight:700;"></span>
      </div>
      <div class="daily-bar-track">
        <div class="daily-bar-fill" id="daily-fill" style="width:0%;"></div>
      </div>
    </div>

    <div class="modules">
      <a href="reading.html" class="module-card">
        <div class="icon">📖</div>
        <h3>Reading</h3>
        <p>閱讀文章並回答問題，訓練閱讀理解與關鍵字定位能力</p>
      </a>
      <a href="listening.html" class="module-card">
        <div class="icon">🎧</div>
        <h3>Listening</h3>
        <p>播放音檔後作答，訓練聽力理解與筆記能力</p>
      </a>
      <a href="writing.html" class="module-card">
        <div class="icon">✏️</div>
        <h3>Writing</h3>
        <p>限時作文練習，含字數計算與範文對照，訓練寫作結構與表達</p>
      </a>
      <a href="vocabulary.html" class="module-card">
        <div class="icon">📚</div>
        <h3>Vocabulary</h3>
        <p>4,931 個雅思單字，支援搜尋、收藏、單字卡與拼字測驗</p>
      </a>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
  <script>
    const todayKey = 'ielts_today_' + new Date().toISOString().slice(0,10);
    const todayCount = parseInt(localStorage.getItem(todayKey) || '0');
    const dailyGoal = parseInt(localStorage.getItem('ielts_daily_goal') || '20');
    const practiced = JSON.parse(localStorage.getItem('ielts_practiced') || '[]').length;
    const errors = JSON.parse(localStorage.getItem('ielts_errors') || '[]').length;

    // accuracy: practiced = correct, errors = wrong (some overlap but good estimate)
    const total = practiced + errors;
    const accuracy = total > 0 ? Math.round((practiced / total) * 100) + '%' : '—';

    document.getElementById('stat-practiced').textContent = practiced;
    document.getElementById('stat-accuracy').textContent = accuracy;
    document.getElementById('stat-errors').textContent = errors;

    const pct = Math.min(100, Math.round((todayCount / dailyGoal) * 100));
    document.getElementById('daily-fill').style.width = pct + '%';
    document.getElementById('daily-label').textContent =
      todayCount >= dailyGoal ? '🎉 今日達標！' : todayCount + ' / ' + dailyGoal + ' 個';
  </script>
</body>
</html>
