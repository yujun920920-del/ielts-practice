<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Writing — IELTS Practice</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1a3c5e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="IELTS" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    /* Task selector */
    .task-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }
    .task-tab {
      padding: 10px 24px;
      border-radius: 8px;
      border: 2px solid #c8d8ee;
      background: white;
      color: #1a3c5e;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .task-tab.active {
      background: #1a3c5e;
      color: white;
      border-color: #1a3c5e;
    }

    /* Prompt box */
    .prompt-box {
      background: #f5f8fc;
      border-left: 4px solid #1a3c5e;
      border-radius: 0 8px 8px 0;
      padding: 18px 20px;
      font-size: 15px;
      line-height: 1.7;
      color: #333;
      margin-bottom: 4px;
    }
    .prompt-label {
      font-size: 11px;
      font-weight: 700;
      color: #1a3c5e;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .prompt-note {
      font-size: 13px;
      color: #888;
      margin-top: 10px;
    }

    /* Writing area */
    .write-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .write-meta-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .word-count {
      font-size: 14px;
      color: #555;
    }
    .word-count span {
      font-weight: 700;
      color: #1a3c5e;
    }
    .word-count.warn span { color: #c0392b; }
    .word-count.ok span { color: #1a6630; }

    .timer-display {
      font-size: 20px;
      font-weight: 700;
      color: #1a3c5e;
      font-variant-numeric: tabular-nums;
    }
    .timer-display.warn { color: #c0392b; }

    .timer-controls {
      display: flex;
      gap: 8px;
    }

    textarea#essay {
      width: 100%;
      min-height: 280px;
      padding: 16px;
      border: 1.5px solid #ccd8e8;
      border-radius: 8px;
      font-size: 15px;
      line-height: 1.8;
      resize: vertical;
      outline: none;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    textarea#essay:focus {
      border-color: #1a3c5e;
    }

    /* Sample answer */
    #sample-section {
      display: none;
    }
    .sample-box {
      background: #f9fbff;
      border: 1px solid #d0e4f7;
      border-radius: 8px;
      padding: 20px;
      font-size: 14px;
      line-height: 1.8;
      color: #333;
      white-space: pre-wrap;
    }
    .checklist {
      margin-top: 16px;
    }
    .checklist h3 {
      font-size: 15px;
      color: #1a3c5e;
      margin-bottom: 10px;
    }
    .checklist label {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 0;
      font-size: 14px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
    }
    .checklist label:last-child { border-bottom: none; }
    .checklist input[type="checkbox"] {
      accent-color: #1a3c5e;
      width: 16px;
      height: 16px;
    }
    .self-score {
      margin-top: 20px;
      padding: 16px;
      background: #f0f6ff;
      border-radius: 8px;
    }
    .self-score h3 {
      font-size: 15px;
      color: #1a3c5e;
      margin-bottom: 10px;
    }
    .band-select {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .band-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1.5px solid #c8d8ee;
      background: white;
      color: #555;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .band-btn.selected {
      background: #1a3c5e;
      color: white;
      border-color: #1a3c5e;
    }

    /* AI Key Setting */
    .ai-key-bar {
      background: #fff8e1;
      border: 1.5px solid #ffd54f;
      border-radius: 10px;
      padding: 14px 18px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .ai-key-bar.hidden { display: none; }
    .ai-key-bar-label { font-size: 14px; font-weight: 700; color: #5d4037; white-space: nowrap; }
    .ai-key-input-row { display: flex; gap: 8px; flex: 1; min-width: 200px; }
    .ai-key-input-row input {
      flex: 1; padding: 8px 12px;
      border: 1.5px solid #ffd54f; border-radius: 6px;
      font-size: 13px; font-family: monospace; outline: none;
    }
    .ai-key-input-row input:focus { border-color: #ff8f00; }
    .ai-key-set-info { font-size: 12px; color: #888; margin-bottom: 16px; }
    .ai-key-set-info a { color: #1a3c5e; cursor: pointer; text-decoration: underline; }

    /* AI Result */
    .ai-result-section { display: none; margin-top: 16px; }
    .ai-loading { text-align: center; padding: 32px; color: #1a3c5e; font-size: 15px; }
    .ai-loading .spinner {
      width: 32px; height: 32px;
      border: 3px solid #c8d8ee; border-top-color: #1a3c5e;
      border-radius: 50%; animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .ai-overall {
      text-align: center; padding: 22px;
      background: linear-gradient(135deg, #1a3c5e, #2563a8);
      border-radius: 12px; color: white; margin-bottom: 16px;
    }
    .ai-overall-band { font-size: 56px; font-weight: 800; line-height: 1; }
    .ai-overall-label { font-size: 14px; opacity: 0.85; margin-top: 4px; }
    .ai-score-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    .ai-score-item {
      background: #f5f8fc; border-radius: 8px;
      padding: 14px; border: 1px solid #dce8f5;
    }
    .ai-score-item-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .ai-score-name { font-size: 11px; font-weight: 700; color: #555; text-transform: uppercase; letter-spacing: 0.5px; }
    .ai-score-val { font-size: 24px; font-weight: 800; color: #1a3c5e; }
    .ai-score-feedback { font-size: 12px; color: #666; line-height: 1.5; }
    .ai-section-title { font-size: 14px; font-weight: 700; color: #1a3c5e; margin-bottom: 10px; }
    .ai-list { list-style: none; padding: 0; margin: 0; }
    .ai-list li {
      padding: 7px 0; font-size: 13px; line-height: 1.5;
      border-bottom: 1px solid #f0f0f0; display: flex; gap: 8px;
    }
    .ai-list li:last-child { border-bottom: none; }
    .ai-list li::before { content: '✓'; color: #27ae60; font-weight: bold; flex-shrink: 0; }
    .ai-list.improve li::before { content: '→'; color: #e67e22; }
    .ai-correction-item {
      background: #fff8f0; border-left: 3px solid #e67e22;
      border-radius: 0 6px 6px 0; padding: 10px 14px;
      margin-bottom: 8px; font-size: 13px;
    }
    .ai-correction-orig { color: #c0392b; text-decoration: line-through; margin-bottom: 4px; }
    .ai-correction-fixed { color: #1a6630; font-weight: 600; margin-bottom: 4px; }
    .ai-correction-exp { color: #777; }
    .ai-error {
      background: #fff0f0; border: 1px solid #ffcdd2;
      border-radius: 8px; padding: 16px;
      color: #c0392b; font-size: 14px; text-align: center;
    }
  </style>

  <script>
    // Dark mode
    (function(){
      const dark = localStorage.getItem('ielts_dark') === '1';
      if (dark) document.body.classList.add('dark');
    })();
    function toggleDark() {
      document.body.classList.toggle('dark');
      localStorage.setItem('ielts_dark', document.body.classList.contains('dark') ? '1' : '0');
      document.getElementById('dark-btn').textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
    }
  </script>
</head>
<body>
  <header>
    <h1>IELTS Practice</h1>
    <a href="index.html">← 返回首頁</a>
  </header>

  <div class="container">
    <div class="page-title">Writing Practice</div>
    <div class="page-subtitle">選擇題型，在時間內完成作文，完成後對照範文自我評估。</div>

    <!-- AI Key Setting -->
    <div id="ai-key-bar" class="ai-key-bar">
      <div class="ai-key-bar-label">🤖 Gemini API Key</div>
      <div style="flex:1;">
        <div class="ai-key-input-row">
          <input type="password" id="ai-key-input" placeholder="貼上你的 Gemini API Key..." />
          <button class="btn btn-primary" style="padding:8px 16px;font-size:13px;white-space:nowrap;" onclick="saveApiKey()">儲存</button>
        </div>
      </div>
    </div>
    <div id="ai-key-set-info" class="ai-key-set-info" style="display:none;">
      🤖 AI 批改已啟用 &nbsp;<a onclick="resetApiKey()">修改 Key</a>
    </div>

    <!-- Task selector -->
    <div class="task-tabs">
      <button class="task-tab active" onclick="switchTask(1)">Task 1　圖表描述</button>
      <button class="task-tab" onclick="switchTask(2)">Task 2　議論文</button>
    </div>

    <!-- Prompt -->
    <div class="card" id="prompt-card">
      <div class="prompt-label">Writing Prompt</div>

      <div id="prompt-task1">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;">
          <span id="t1-type-badge" style="background:#1a3c5e;color:white;font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px;letter-spacing:0.5px;"></span>
          <span id="t1-counter" style="font-size:13px;color:#aaa;"></span>
          <button class="btn btn-secondary" style="margin-left:auto;padding:6px 14px;font-size:12px;" onclick="randomTask1Question()">🔀 隨機換題</button>
        </div>
        <div class="prompt-box" id="t1-prompt-text"></div>
        <div class="prompt-note">Task 1：至少 150 字　｜　建議時間 20 分鐘</div>
        <div style="margin-top:14px;background:#f5f8fc;border-radius:8px;padding:16px;">
          <canvas id="task1-chart" height="160"></canvas>
        </div>
      </div>

      <div id="prompt-task2" style="display:none;">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;">
          <span id="t2-type-badge" style="background:#1a3c5e;color:white;font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px;letter-spacing:0.5px;"></span>
          <span id="t2-counter" style="font-size:13px;color:#aaa;"></span>
          <button class="btn btn-secondary" style="margin-left:auto;padding:6px 14px;font-size:12px;" onclick="randomTask2Question()">🔀 隨機換題</button>
        </div>
        <div class="prompt-box" id="t2-prompt-text"></div>
        <div class="prompt-note">Task 2：至少 250 字　｜　建議時間 40 分鐘</div>
      </div>
    </div>

    <!-- Writing area -->
    <div class="card">
      <div class="write-meta">
        <div class="write-meta-left">
          <div class="word-count" id="word-count-display">
            字數：<span id="wc">0</span> / <span id="wc-min">150</span>
          </div>
        </div>
        <div style="display:flex; align-items:center; gap:12px;">
          <div class="timer-display" id="timer-display">20:00</div>
          <div class="timer-controls">
            <button class="btn btn-secondary" style="padding:8px 16px; font-size:13px;" onclick="toggleTimer()">開始計時</button>
            <button class="btn btn-secondary" style="padding:8px 16px; font-size:13px;" onclick="resetTimer()">重置</button>
          </div>
        </div>
      </div>
      <textarea id="essay" placeholder="在這裡開始寫作..."></textarea>
      <div class="actions" style="margin-top:16px;">
        <button class="btn btn-primary" onclick="submitEssay()">完成作答 &amp; 看範文</button>
        <button class="btn" style="background:#5c35d4;color:white;" onclick="getAiFeedback()">🤖 AI 批改</button>
        <button class="btn btn-secondary" onclick="resetEssay()">重新作答</button>
      </div>

      <!-- AI Result -->
      <div class="ai-result-section" id="ai-result-section">
        <div id="ai-result-content"></div>
      </div>
    </div>

    <!-- Sample answer + checklist -->
    <div id="sample-section">
      <div class="card">
        <h2>範文參考</h2>
        <div class="sample-box" id="sample-text"></div>
      </div>

      <div class="card">
        <div class="checklist">
          <h3>自我檢查清單</h3>
          <div id="checklist-items"></div>
        </div>
        <div class="self-score">
          <h3>自評 Band Score</h3>
          <div class="band-select" id="band-select">
            <button class="band-btn" onclick="selectBand(this, 4)">Band 4</button>
            <button class="band-btn" onclick="selectBand(this, 5)">Band 5</button>
            <button class="band-btn" onclick="selectBand(this, 6)">Band 6</button>
            <button class="band-btn" onclick="selectBand(this, 7)">Band 7</button>
            <button class="band-btn" onclick="selectBand(this, 8)">Band 8</button>
          </div>
          <div id="band-feedback" style="margin-top:12px; font-size:13px; color:#555;"></div>
        </div>
      </div>
    </div>

    <!-- Writing History -->
    <div class="card" style="margin-top:24px;">
      <h2>練習歷史紀錄</h2>
      <div id="history-box"></div>
    </div>
  </div>

  <script>
    let currentTask = 1;
    let timerInterval = null;
    let secondsLeft = 20 * 60;
    let timerRunning = false;

    const taskConfig = {
      1: {
        minWords: 150,
        totalSeconds: 20 * 60,
        checklist: [
          '有清楚的開頭段（paraphrase 題目）',
          '提到整體趨勢（overview）',
          '具體描述主要數據變化',
          '有進行數據比較',
          '沒有給出個人意見（Task 1 不需要）',
          '字數達到 150 字以上',
        ],
        sample: `The bar chart illustrates the proportion of households in owned and rented accommodation in England and Wales from 1918 to 2011.

Overall, there was a clear long-term shift from renting to owning homes over the period, although owned accommodation saw a slight decline in the final decade.

In 1918, the vast majority of households rented their homes, at 77%, while only 23% were owner-occupied. This gap narrowed steadily over the following decades. By 1971, owned and rented accommodation reached roughly equal proportions at 52% and 48% respectively, marking a significant turning point.

The trend towards homeownership continued to accelerate through the latter half of the twentieth century. Owner-occupied households peaked at 69% in 2001, compared to just 31% for renters. However, between 2001 and 2011, this trend reversed slightly, with ownership falling to 64% and renting rising to 36%.

In summary, England and Wales experienced a dramatic transformation from a predominantly renting society to a homeowning one over the course of the twentieth century, though the final years suggest a modest reversal of this trend.`,
      },
      2: {
        minWords: 250,
        totalSeconds: 40 * 60,
      },
    };

    function switchTask(num) {
      currentTask = num;
      document.querySelectorAll('.task-tab').forEach((t, i) => {
        t.classList.toggle('active', i + 1 === num);
      });
      document.getElementById('prompt-task1').style.display = num === 1 ? '' : 'none';
      document.getElementById('prompt-task2').style.display = num === 2 ? '' : 'none';
      if (num === 1) loadTask1Question(currentTask1Idx);
      if (num === 2) loadTask2Question(currentTask2Idx);

      const cfg = taskConfig[num];
      document.getElementById('wc-min').textContent = cfg.minWords;
      secondsLeft = cfg.totalSeconds;
      updateTimerDisplay();
      resetEssay();
    }

    // Word counter
    document.getElementById('essay').addEventListener('input', updateWordCount);

    function countWords(text) {
      return text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
    }

    function updateWordCount() {
      const wc = countWords(document.getElementById('essay').value);
      const min = taskConfig[currentTask].minWords;
      const el = document.getElementById('word-count-display');
      document.getElementById('wc').textContent = wc;
      el.className = 'word-count' + (wc === 0 ? '' : wc < min ? ' warn' : ' ok');
    }

    // Timer
    function updateTimerDisplay() {
      const m = Math.floor(secondsLeft / 60).toString().padStart(2, '0');
      const s = (secondsLeft % 60).toString().padStart(2, '0');
      const el = document.getElementById('timer-display');
      el.textContent = `${m}:${s}`;
      el.className = 'timer-display' + (secondsLeft <= 120 ? ' warn' : '');
    }

    function toggleTimer() {
      const btn = document.querySelector('.timer-controls button');
      if (timerRunning) {
        clearInterval(timerInterval);
        timerRunning = false;
        btn.textContent = '繼續計時';
      } else {
        timerRunning = true;
        btn.textContent = '暫停計時';
        timerInterval = setInterval(() => {
          if (secondsLeft <= 0) {
            clearInterval(timerInterval);
            timerRunning = false;
            btn.textContent = '時間到';
            alert('時間到！請完成作答。');
            return;
          }
          secondsLeft--;
          updateTimerDisplay();
        }, 1000);
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timerRunning = false;
      secondsLeft = taskConfig[currentTask].totalSeconds;
      updateTimerDisplay();
      document.querySelector('.timer-controls button').textContent = '開始計時';
    }

    // History
    let writingHistory = JSON.parse(localStorage.getItem('ielts_writing_history') || '[]');

    function saveHistory(wc, timeUsed) {
      const entry = {
        date: new Date().toLocaleDateString('zh-TW'),
        task: 'Task ' + currentTask,
        words: wc,
        time: timeUsed,
        met: wc >= taskConfig[currentTask].minWords
      };
      writingHistory.unshift(entry);
      if (writingHistory.length > 20) writingHistory = writingHistory.slice(0, 20);
      localStorage.setItem('ielts_writing_history', JSON.stringify(writingHistory));
    }

    function renderHistory() {
      const box = document.getElementById('history-box');
      if (writingHistory.length === 0) {
        box.innerHTML = '<div style="color:#aaa;font-size:14px;text-align:center;padding:16px;">還沒有練習紀錄</div>';
        return;
      }
      box.innerHTML = writingHistory.map(e =>
        '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f0f0f0;font-size:13px;">' +
        '<span style="color:#555;">' + e.date + '　' + e.task + '</span>' +
        '<span>' + e.words + ' 字　' + e.time + '</span>' +
        '<span class="tag ' + (e.met ? 'tag-correct' : 'tag-wrong') + '">' + (e.met ? '達標' : '未達標') + '</span>' +
        '</div>'
      ).join('');
    }

    // Submit
    function submitEssay() {
      const wc = countWords(document.getElementById('essay').value);
      const min = taskConfig[currentTask].minWords;
      if (wc < 10) {
        alert('請先寫一些內容再提交！');
        return;
      }

      clearInterval(timerInterval);
      timerRunning = false;

      // Calculate time used
      const totalSec = taskConfig[currentTask].totalSeconds;
      const usedSec = totalSec - secondsLeft;
      const mm = Math.floor(usedSec / 60).toString().padStart(2,'0');
      const ss = (usedSec % 60).toString().padStart(2,'0');
      saveHistory(wc, mm + ':' + ss);
      renderHistory();

      const cfg = taskConfig[currentTask];

      if (currentTask === 1) {
        document.getElementById('sample-text').textContent = cfg.sample;
        document.getElementById('sample-section').querySelector('.card:first-child').style.display = '';
      } else {
        document.getElementById('sample-section').querySelector('.card:first-child').style.display = 'none';
      }

      const checklist = currentTask === 1
        ? cfg.checklist
        : checklistByType[task2Questions[currentTask2Idx].type];
      const checklistEl = document.getElementById('checklist-items');
      checklistEl.innerHTML = checklist.map(item =>
        `<label><input type="checkbox" /> ${item}</label>`
      ).join('');

      document.getElementById('band-select').querySelectorAll('.band-btn')
        .forEach(b => b.classList.remove('selected'));
      document.getElementById('band-feedback').textContent = '';

      const section = document.getElementById('sample-section');
      section.style.display = 'block';
      section.scrollIntoView({ behavior: 'smooth' });
    }

    function selectBand(btn, band) {
      document.querySelectorAll('.band-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      const feedback = {
        4: '仍在發展階段。建議多練習段落結構，並注意基本文法。',
        5: '有基本表達能力，但結構與詞彙仍需加強。建議多閱讀高分範文。',
        6: '達到及格水準。注重連接詞的使用與論點的發展深度。',
        7: '表現良好！繼續精進詞彙多樣性與論述的邏輯性。',
        8: '優秀的作文！結構清晰、論點有力，繼續保持。',
      };
      document.getElementById('band-feedback').textContent = feedback[band];
    }

    function resetEssay() {
      clearInterval(timerInterval);
      timerRunning = false;
      document.getElementById('essay').value = '';
      updateWordCount();
      resetTimer();
      document.getElementById('sample-section').style.display = 'none';
      document.querySelector('.timer-controls button').textContent = '開始計時';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // --- Task 2 Questions ---
    const task2Questions = [
      {
        type: 'discuss', typeLabel: 'Discuss Both Views',
        text: 'Some people think that parents should teach children how to be good members of society. Others, however, believe that school is the place to learn this.',
        instruction: 'Discuss both these views and give your own opinion.'
      },
      {
        type: 'discuss', typeLabel: 'Discuss Both Views',
        text: 'Some people believe that unpaid community service should be a compulsory part of high school programmes. Others disagree.',
        instruction: 'Discuss both views and give your own opinion.'
      },
      {
        type: 'discuss', typeLabel: 'Discuss Both Views',

    // --- AI Feedback ---
    function initApiKey() {
      const key = localStorage.getItem('ielts_gemini_key');
      if (key) {
        document.getElementById('ai-key-bar').classList.add('hidden');
        document.getElementById('ai-key-set-info').style.display = 'block';
      } else {
        document.getElementById('ai-key-bar').classList.remove('hidden');
        document.getElementById('ai-key-set-info').style.display = 'none';
      }
    }

    function saveApiKey() {
      const key = document.getElementById('ai-key-input').value.trim();
      if (!key) { alert('請輸入 API Key'); return; }
      localStorage.setItem('ielts_gemini_key', key);
      document.getElementById('ai-key-input').value = '';
      initApiKey();
    }

    function resetApiKey() {
      localStorage.removeItem('ielts_gemini_key');
      initApiKey();
    }

    async function getAiFeedback() {
      const apiKey = localStorage.getItem('ielts_gemini_key');
      if (!apiKey) { alert('請先設定 Gemini API Key（頁面上方輸入欄）'); return; }

      const essay = document.getElementById('essay').value.trim();
      if (essay.length < 50) { alert('請先寫一些內容再使用 AI 批改！'); return; }

      const section = document.getElementById('ai-result-section');
      const content = document.getElementById('ai-result-content');
      section.style.display = 'block';
      content.innerHTML = '<div class="ai-loading"><div class="spinner"></div>AI 批改中，請稍候...</div>';
      section.scrollIntoView({ behavior: 'smooth' });

      const taskLabel = currentTask === 1 ? 'Task 1（圖表描述）' : 'Task 2（議論文）';
      const prompt = `你是一位專業的 IELTS 寫作考官。請評估以下 IELTS Writing ${taskLabel} 的作文。

學生作文：
"""
${essay}
"""

請根據官方四項評分標準評估，只回傳 JSON（不加任何其他文字或 markdown）：
{"overall_band":數字,"task_achievement":{"score":數字,"feedback":"2-3句中文"},"coherence_cohesion":{"score":數字,"feedback":"2-3句中文"},"lexical_resource":{"score":數字,"feedback":"2-3句中文"},"grammatical_range":{"score":數字,"feedback":"2-3句中文"},"strengths":["優點1","優點2","優點3"],"improvements":["建議1","建議2","建議3"],"corrected_sentences":[{"original":"原句","corrected":"修正後","explanation":"說明"}]}`;

      try {
        const res = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent`,
          {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-goog-api-key': apiKey
            },
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
          }
        );
        if (!res.ok) {
          const errBody = await res.json().catch(() => ({}));
          const msg = errBody?.error?.message || res.status;
          throw new Error('API 錯誤：' + msg);
        }
        const data = await res.json();
        const text = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
        const match = text.match(/\{[\s\S]*\}/);
        if (!match) throw new Error('無法解析 AI 回應');
        renderAiResults(JSON.parse(match[0]));
      } catch (err) {
        content.innerHTML = `<div class="ai-error">❌ ${err.message}<br><small>請確認 API Key 是否正確，或稍後再試。</small></div>`;
      }
    }

    function renderAiResults(r) {
      const criteriaName = currentTask === 1 ? 'Task Achievement' : 'Task Response';
      const ta = r.task_achievement || {};
      const cc = r.coherence_cohesion || {};
      const lr = r.lexical_resource || {};
      const gr = r.grammatical_range || {};

      const strengths = (r.strengths || []).map(s => `<li>${s}</li>`).join('');
      const improvements = (r.improvements || []).map(s => `<li>${s}</li>`).join('');
      const corrections = (r.corrected_sentences || []).map(c =>
        `<div class="ai-correction-item">
          <div class="ai-correction-orig">✗ ${c.original}</div>
          <div class="ai-correction-fixed">✓ ${c.corrected}</div>
          <div class="ai-correction-exp">${c.explanation}</div>
        </div>`
      ).join('');

      document.getElementById('ai-result-content').innerHTML = `
        <div class="ai-overall">
          <div class="ai-overall-band">${r.overall_band}</div>
          <div class="ai-overall-label">估計 Band Score</div>
        </div>
        <div class="ai-score-grid">
          <div class="ai-score-item">
            <div class="ai-score-item-top"><div class="ai-score-name">${criteriaName}</div><div class="ai-score-val">${ta.score ?? '-'}</div></div>
            <div class="ai-score-feedback">${ta.feedback || ''}</div>
          </div>
          <div class="ai-score-item">
            <div class="ai-score-item-top"><div class="ai-score-name">Coherence &amp; Cohesion</div><div class="ai-score-val">${cc.score ?? '-'}</div></div>
            <div class="ai-score-feedback">${cc.feedback || ''}</div>
          </div>
          <div class="ai-score-item">
            <div class="ai-score-item-top"><div class="ai-score-name">Lexical Resource</div><div class="ai-score-val">${lr.score ?? '-'}</div></div>
            <div class="ai-score-feedback">${lr.feedback || ''}</div>
          </div>
          <div class="ai-score-item">
            <div class="ai-score-item-top"><div class="ai-score-name">Grammatical Range</div><div class="ai-score-val">${gr.score ?? '-'}</div></div>
            <div class="ai-score-feedback">${gr.feedback || ''}</div>
          </div>
        </div>
        ${strengths ? `<div class="card" style="margin-bottom:12px;padding:16px 20px;"><div class="ai-section-title">✅ 優點</div><ul class="ai-list">${strengths}</ul></div>` : ''}
        ${improvements ? `<div class="card" style="margin-bottom:12px;padding:16px 20px;"><div class="ai-section-title">📝 改善建議</div><ul class="ai-list improve">${improvements}</ul></div>` : ''}
        ${corrections ? `<div class="card" style="padding:16px 20px;"><div class="ai-section-title">🔧 句子修正</div>${corrections}</div>` : ''}
      `;
    }

    // Init
    updateTimerDisplay();
    updateWordCount();
    renderHistory();
    initApiKey();
    loadTask1Question(0);
    loadTask2Question(0);

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
  </script>
