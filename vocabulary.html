<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vocabulary — IELTS Practice</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1a3c5e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="IELTS" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .vocab-toolbar { display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
    .search-input { flex:1; min-width:200px; padding:10px 16px; border:1.5px solid #ccd8e8; border-radius:8px; font-size:15px; outline:none; transition:border-color 0.2s; }
    .search-input:focus { border-color:#1a3c5e; }
    .filter-btns { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
    .filter-btn { padding:7px 14px; border-radius:20px; border:1.5px solid #c8d8ee; background:white; color:#555; font-size:13px; cursor:pointer; transition:all 0.15s; white-space:nowrap; }
    .filter-btn.active { background:#1a3c5e; color:white; border-color:#1a3c5e; }
    .stats-bar { font-size:13px; color:#888; margin-bottom:12px; }
    .stats-bar span { color:#1a3c5e; font-weight:700; }
    .mode-toggle { display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
    .mode-btn { padding:9px 20px; border-radius:8px; border:2px solid #c8d8ee; background:white; color:#1a3c5e; font-size:14px; font-weight:600; cursor:pointer; transition:all 0.15s; }
    .mode-btn.active { background:#1a3c5e; color:white; border-color:#1a3c5e; }
    .vocab-list { display:flex; flex-direction:column; gap:10px; }
    .vocab-item { background:white; border-radius:10px; padding:16px 18px; box-shadow:0 1px 6px rgba(0,0,0,0.07); display:flex; gap:14px; align-items:flex-start; }
    .vocab-main { flex:1; min-width:0; }
    .vocab-word { font-size:18px; font-weight:700; color:#1a3c5e; margin-bottom:2px; }
    .vocab-type { display:inline-block; font-size:11px; padding:2px 8px; background:#e8f0fb; color:#1a3c5e; border-radius:12px; margin-bottom:5px; font-weight:600; }
    .vocab-meaning { font-size:14px; color:#333; font-weight:600; margin-bottom:4px; }
    .vocab-example { font-size:13px; color:#888; font-style:italic; line-height:1.5; }
    .vocab-category-tag { font-size:11px; padding:3px 8px; border-radius:12px; border:1px solid #e0e8f4; color:#999; white-space:nowrap; align-self:flex-start; flex-shrink:0; }
    .star-btn { background:none; border:none; font-size:18px; cursor:pointer; padding:0; line-height:1; opacity:0.35; transition:opacity 0.15s,transform 0.15s; flex-shrink:0; }
    .star-btn.starred { opacity:1; }
    .star-btn:hover { transform:scale(1.2); opacity:0.8; }
    .pagination { display:flex; align-items:center; justify-content:center; gap:8px; margin-top:20px; flex-wrap:wrap; }
    .page-btn { padding:7px 14px; border-radius:7px; border:1.5px solid #c8d8ee; background:white; color:#1a3c5e; font-size:13px; cursor:pointer; transition:all 0.15s; }
    .page-btn:hover { background:#e8f0fb; }
    .page-btn.active { background:#1a3c5e; color:white; border-color:#1a3c5e; }
    .page-btn:disabled { opacity:0.35; cursor:default; }
    .page-info { font-size:13px; color:#888; padding:0 4px; }
    #card-view { display:none; text-align:center; }
    .flashcard-wrap { perspective:1000px; margin:0 auto 20px; width:100%; max-width:480px; height:220px; cursor:pointer; }
    .flashcard { width:100%; height:100%; position:relative; transform-style:preserve-3d; transition:transform 0.45s; }
    .flashcard.flipped { transform:rotateY(180deg); }
    .card-face { position:absolute; width:100%; height:100%; backface-visibility:hidden; border-radius:14px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; box-shadow:0 4px 16px rgba(0,0,0,0.12); }
    .card-front { background:#1a3c5e; color:white; }
    .card-front .card-word { font-size:30px; font-weight:700; margin-bottom:4px; }
    .card-front .card-phonetic { font-size:14px; opacity:0.75; margin-bottom:4px; letter-spacing:0.5px; }
    .card-front .card-type { font-size:13px; opacity:0.65; }
    .card-back { background:white; transform:rotateY(180deg); }
    .card-back .card-meaning { font-size:20px; font-weight:700; color:#1a3c5e; margin-bottom:8px; }
    .card-back .card-example { font-size:12px; color:#888; font-style:italic; line-height:1.5; }
    .card-hint { font-size:13px; color:#aaa; margin-bottom:14px; }
    .card-progress { width:100%; max-width:480px; background:#dce6f0; border-radius:8px; height:6px; margin:0 auto 16px; overflow:hidden; }
    .card-progress-fill { height:100%; background:#1a3c5e; border-radius:8px; transition:width 0.3s; }
    .card-nav { display:flex; justify-content:center; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:12px; }
    .card-counter { font-size:14px; color:#888; min-width:80px; text-align:center; }
    .empty-msg { text-align:center; color:#aaa; padding:40px; font-size:15px; }
    #spell-input:focus { border-color:#1a3c5e; }
    #spell-input.correct { border-color:#1a6630; background:#d4edda; color:#1a6630; }
    #spell-input.wrong { border-color:#b52020; background:#fde8e8; color:#b52020; }
    .qty-btn { padding:10px 18px; border-radius:8px; border:2px solid #c8d8ee; background:white; color:#1a3c5e; font-size:15px; font-weight:600; cursor:pointer; transition:all 0.15s; }
    .qty-btn:hover { background:#e8f0fb; }
    .qty-btn.active { background:#1a3c5e; color:white; border-color:#1a3c5e; }
    .accent-btn { padding:5px 12px; border-radius:16px; border:1.5px solid #c8d8ee; background:white; color:#555; font-size:13px; cursor:pointer; transition:all 0.15s; }
    .accent-btn:hover { background:#e8f0fb; }
    .accent-btn.active { background:#1a3c5e; color:white; border-color:#1a3c5e; }
  </style>

  <script>
    // Dark mode
    (function(){
      const dark = localStorage.getItem('ielts_dark') === '1';
      if (dark) document.body.classList.add('dark');
    })();
    function toggleDark() {
      document.body.classList.toggle('dark');
      localStorage.setItem('ielts_dark', document.body.classList.contains('dark') ? '1' : '0');
      document.getElementById('dark-btn').textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
    }
  </script>
</head>
<body>
  <header>
    <h1>IELTS Practice</h1>
    <a href="index.html">← 返回首頁</a>
  </header>
  <div class="container">
    <div class="page-title">Vocabulary Bank</div>
    <div class="page-subtitle" id="total-subtitle"></div>

    <!-- Daily goal bar -->
    <div id="daily-goal-bar" style="background:white;border-radius:10px;padding:14px 18px;margin-bottom:16px;box-shadow:0 1px 6px rgba(0,0,0,0.07);display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
      <div style="flex:1;min-width:160px;">
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;">
          <span style="color:#555;font-weight:600;">今日目標</span>
          <span id="daily-count-label" style="color:#1a3c5e;font-weight:700;"></span>
        </div>
        <div style="background:#e8f0fb;border-radius:8px;height:8px;overflow:hidden;">
          <div id="daily-progress-fill" style="height:100%;background:#1a3c5e;border-radius:8px;transition:width 0.4s;width:0%;"></div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;font-size:13px;color:#555;">
        目標：
        <select id="daily-goal-select" onchange="saveDailyGoal()" style="padding:4px 8px;border:1px solid #ccd8e8;border-radius:6px;font-size:13px;outline:none;">
          <option value="10">10 個</option>
          <option value="20" selected>20 個</option>
          <option value="30">30 個</option>
          <option value="50">50 個</option>
        </select>
      </div>
      <div id="daily-done-badge" style="display:none;background:#d4edda;color:#1a6630;padding:4px 12px;border-radius:16px;font-size:13px;font-weight:700;">🎉 今日達標！</div>
    </div>

    <div class="mode-toggle">
      <button class="mode-btn active" onclick="switchMode('list')">📋 列表瀏覽</button>
      <button class="mode-btn" onclick="switchMode('card')">🃏 單字卡練習</button>
      <button class="mode-btn" onclick="switchMode('starred')">⭐ 已收藏</button>
      <button class="mode-btn" onclick="switchMode('spell')">✏️ 拼字測驗</button>
      <button class="mode-btn" onclick="switchMode('errors')">❌ 錯誤單字本</button>
    </div>
    <div id="toolbar">
      <div class="vocab-toolbar">
        <input class="search-input" type="text" id="search-input" placeholder="搜尋單字或中文意思..." oninput="onSearch()" />
      </div>
      <div class="filter-btns" id="filter-btns"></div>
      <div class="stats-bar" id="stats-bar"></div>
    </div>
    <div id="list-view">
      <div class="vocab-list" id="vocab-list"></div>
      <div class="pagination" id="pagination"></div>
    </div>
    <div id="card-view">
      <div class="card-progress"><div class="card-progress-fill" id="card-progress-fill"></div></div>
      <div style="display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:8px;">
        <p class="card-hint" style="margin:0;">點擊卡片翻面 · 空白鍵翻面 · 左右鍵換卡</p>
        <button id="speech-toggle" onclick="toggleSpeech()" style="padding:5px 12px;border-radius:16px;border:1.5px solid #c8d8ee;background:white;color:#1a3c5e;font-size:12px;cursor:pointer;">🔊 朗讀：開</button>
      </div>
      <div style="display:flex;justify-content:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
        <button class="accent-btn" onclick="setAccent('en-GB',this)">🇬🇧 英式</button>
        <button class="accent-btn" onclick="setAccent('en-AU',this)">🇦🇺 澳式</button>
        <button class="accent-btn" onclick="setAccent('en-US',this)">🇺🇸 美式</button>
        <button class="accent-btn" onclick="setAccent('en-NZ',this)">🇳🇿 紐式</button>
      </div>
      <div class="flashcard-wrap" onclick="flipCard()">
        <div class="flashcard" id="flashcard">
          <div class="card-face card-front">
            <div class="card-word" id="card-word"></div>
            <div class="card-phonetic" id="card-phonetic"></div>
            <div class="card-type" id="card-type"></div>
            <button onclick="event.stopPropagation(); fetchAndPlay(document.getElementById('card-word').textContent)" style="margin-top:14px;background:rgba(255,255,255,0.2);border:1.5px solid rgba(255,255,255,0.5);color:white;border-radius:20px;padding:5px 16px;font-size:14px;cursor:pointer;">🔊 聽發音</button>
          </div>
          <div class="card-face card-back">
            <div class="card-meaning" id="card-meaning"></div>
            <div class="card-example" id="card-example"></div>
          </div>
        </div>
      </div>
      <div class="card-nav">
        <button class="btn btn-secondary" onclick="prevCard()">← 上一張</button>
        <div class="card-counter" id="card-counter"></div>
        <button class="btn btn-primary" onclick="nextCard()">下一張 →</button>
      </div>
      <button class="btn btn-secondary" onclick="shuffleCards()" style="font-size:13px;padding:8px 18px;">🔀 隨機排序</button>
    </div>

    <!-- Errors view -->
    <div id="errors-view" style="display:none;">
      <div class="card" style="margin-bottom:0;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px;">
          <h2 style="margin:0;">❌ 錯誤單字本</h2>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-primary" style="font-size:13px;padding:8px 16px;" onclick="switchMode('spell')">✏️ 拿去拼字練習</button>
            <button class="btn btn-secondary" style="font-size:13px;padding:8px 16px;" onclick="clearErrors()">清除全部</button>
          </div>
        </div>
        <div id="error-count" style="font-size:13px;color:#888;margin-bottom:16px;"></div>
        <div id="errors-list" class="vocab-list"></div>
      </div>
    </div>

    <!-- Spell view -->
    <div id="spell-view" style="display:none; text-align:center;">
      <div class="card-progress"><div class="card-progress-fill" id="spell-progress-fill"></div></div>
      <!-- 數量選擇畫面 -->
      <div id="spell-setup" style="background:white;border-radius:12px;padding:32px 28px;max-width:420px;margin:0 auto 20px;box-shadow:0 2px 8px rgba(0,0,0,0.08);">
        <div style="font-size:18px;font-weight:700;color:#1a3c5e;margin-bottom:6px;">每次練習幾題？</div>
        <div id="spell-remaining-info" style="font-size:13px;color:#888;margin-bottom:16px;"></div>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:20px;">
          <button class="qty-btn" onclick="setQty(20)">20 題</button>
          <button class="qty-btn active" onclick="setQty(30)">30 題</button>
          <button class="qty-btn" onclick="setQty(50)">50 題</button>
          <button class="qty-btn" onclick="setQty(100)">100 題</button>
          <button class="qty-btn" onclick="setQty(0)">全部</button>
        </div>
        <div style="font-size:13px;color:#888;margin-bottom:16px;">
          💡 想練特定單字？先在「列表瀏覽」點 ☆ 收藏，再用「⭐ 已收藏」模式練習
        </div>
        <button class="btn btn-primary" style="width:100%;margin-bottom:10px;" onclick="startSpell()">開始測驗 →</button>
        <button class="btn btn-secondary" style="width:100%;font-size:13px;" onclick="resetSpellProgress()">🔄 重置練習紀錄（重新從頭練）</button>
      </div>

      <div id="spell-card" style="display:none;background:#1a3c5e;color:white;border-radius:14px;padding:36px 28px;margin:0 auto 20px;max-width:480px;box-shadow:0 4px 16px rgba(0,0,0,0.12);">
        <div style="font-size:12px;opacity:0.6;margin-bottom:8px;" id="spell-type"></div>
        <div style="font-size:22px;font-weight:700;margin-bottom:6px;" id="spell-meaning"></div>
        <div style="font-size:12px;opacity:0.65;font-style:italic;" id="spell-hint"></div>
      </div>
      <div id="spell-input-wrap" style="display:none;margin-bottom:16px;">
        <input id="spell-input" type="text" placeholder="輸入英文單字..."
          style="width:100%;max-width:360px;padding:12px 18px;font-size:17px;border:2px solid #ccd8e8;border-radius:10px;outline:none;text-align:center;"
          onkeydown="if(event.key==='Enter')checkSpell()" />
      </div>
      <div id="spell-feedback" style="display:none;min-height:36px;font-size:15px;margin-bottom:16px;"></div>
      <div id="spell-controls" style="display:none;justify-content:center;gap:12px;flex-wrap:wrap;">
        <button class="btn btn-primary" onclick="checkSpell()">確認</button>
        <button class="btn btn-secondary" onclick="skipSpell()">跳過 →</button>
        <button class="btn btn-secondary" onclick="shuffleSpell()" style="font-size:13px;padding:8px 16px;">🔀 隨機排序</button>
      </div>
      <div class="card-counter" id="spell-counter" style="margin-top:14px;"></div>
      <div id="spell-score-box" style="display:none;background:white;border-radius:12px;padding:28px;margin-top:24px;box-shadow:0 2px 8px rgba(0,0,0,0.08);">
        <div style="font-size:48px;font-weight:700;color:#1a3c5e;" id="spell-final-score"></div>
        <div style="color:#888;margin-bottom:8px;">答對題數</div>
        <div id="spell-remaining-msg" style="font-size:13px;color:#1a3c5e;margin-bottom:16px;font-weight:600;"></div>
        <button class="btn btn-primary" onclick="restartSpell()">繼續練習 →</button>
      </div>
    </div>
  </div>
  <script>
    const PAGE_SIZE = 50;
    const ALL_WORDS = [{"word": "allocate", "type": "verb", "meaning": "分配、撥給", "example": "The government allocated more funds to renewable energy projects.", "category": "學術通用"}, {"word": "assess", "type": "verb", "meaning": "評估、評量", "example": "Teachers assess students' progress through regular tests.", "category": "學術通用"}, {"word": "considerable", "type": "adjective", "meaning": "相當大的、可觀的", "example": "There has been considerable growth in online learning over the past decade.", "category": "學術通用"}, {"word": "constitute", "type": "verb", "meaning": "構成、組成", "example": "Women constitute over half of the university's student population.", "category": "學術通用"}, {"word": "contrast", "type": "verb / noun", "meaning": "對比、對照", "example": "The report contrasts urban and rural living conditions.", "category": "學術通用"}, {"word": "derive", "type": "verb", "meaning": "源自、衍生", "example": "Many English words are derived from Latin.", "category": "學術通用"}, {"word": "distinct", "type": "adjective", "meaning": "明顯的、截然不同的", "example": "There is a distinct difference between the two approaches.", "category": "學術通用"}, {"word": "emerge", "type": "verb", "meaning": "出現、浮現", "example": "New technologies have emerged as solutions to climate change.", "category": "學術通用"}, {"word": "establish", "type": "verb", "meaning": "建立、確立", "example": "The study established a clear link between diet and health.", "category": "學術通用"}, {"word": "evident", "type": "adjective", "meaning": "明顯的、顯而易見的", "example": "It is evident that exercise improves mental health.", "category": "學術通用"}, {"word": "fluctuate", "type": "verb", "meaning": "波動、起伏", "example": "Oil prices fluctuated dramatically throughout the year.", "category": "學術通用"}, {"word": "fundamental", "type": "adjective", "meaning": "基本的、根本的", "example": "Access to clean water is a fundamental human right.", "category": "學術通用"}, {"word": "highlight", "type": "verb", "meaning": "強調、凸顯", "example": "The report highlights the need for urgent action.", "word": "wane", "type": "verb", "meaning": "（月）虧，缺；變暗淡；變小；減少 / n. 月虧；月虧期；衰退；衰退期", "example": "", "category": "IELTS詞庫"}, {"word": "wantonness", "type": "noun", "meaning": "放縱；嬉戲；繁茂", "example": "", "category": "IELTS詞庫"}, {"word": "warlike", "type": "adjective", "meaning": "好戰的；尚武的；戰爭的；軍事的", "example": "", "category": "IELTS詞庫"}, {"word": "wavelet", "type": "noun", "meaning": "小浪；微波、漣漪", "example": "", "category": "IELTS詞庫"}, {"word": "weak-kneed", "type": "adjective", "meaning": "軟弱的，不勇敢的；不堅定的、（強烈的情感作用下）感到軟弱無力的，膝蓋發軟的", "example": "", "category": "IELTS詞庫"}, {"word": "weal", "type": "noun", "meaning": "鞭痕，（棒打的）傷痕", "example": "", "category": "IELTS詞庫"}, {"word": "wean", "type": "verb", "meaning": "給（嬰兒或動物幼崽）斷奶", "example": "", "category": "IELTS詞庫"}, {"word": "wearisome", "type": "adjective", "meaning": "使人疲倦的；令人厭倦的", "example": "", "category": "IELTS詞庫"}, {"word": "wee", "type": "adjective", "meaning": "極小的，很小的；很早的", "example": "", "category": "IELTS詞庫"}, {"word": "well-bred", "type": "adjective", "meaning": "有教養的，受過良好教育的；良種的", "example": "", "category": "IELTS詞庫"}, {"word": "well-doer", "type": "noun", "meaning": "做好事的人", "example": "", "category": "IELTS詞庫"}, {"word": "well-to-do", "type": "adjective", "meaning": "富有的，寬裕的", "example": "", "category": "IELTS詞庫"}, {"word": "whereabouts", "type": "noun", "meaning": "（某人或某物的）行蹤，下落，去向 / adv. 在何處", "example": "", "category": "IELTS詞庫"}, {"word": "whereupon", "type": "conjunction", "meaning": "不久之後；馬上；於是", "example": "", "category": "IELTS詞庫"}, {"word": "wherever", "type": "adverb", "meaning": "無論什麼地方；去任何地方 / conj. 無論在哪裡；無論到哪裡；無論什麼情況下", "example": "", "category": "IELTS詞庫"}, {"word": "wherewith", "type": "pronoun", "meaning": "用以…的東西", "example": "", "category": "IELTS詞庫"}, {"word": "whet", "type": "verb", "meaning": "磨，磨快；刺激，促進；增強（食欲、慾望等） / n. 磨；開胃物（如酒等）；刺激物", "example": "", "category": "IELTS詞庫"}, {"word": "whimsical", "type": "adjective", "meaning": "想入非非的，異想天開的；怪誕的，古怪的", "example": "", "category": "IELTS詞庫"}, {"word": "whine", "type": "verb", "meaning": "（狗等）發哀鳴聲；（機器等）嘎嘎響；嗖嗖響、哀訴；嘀咕著說 / n. 哀鳴聲；嗚咽聲；嘎嘎聲；嗖嗖聲", "example": "", "category": "IELTS詞庫"}, {"word": "wholly", "type": "adverb", "meaning": "完全地；全部；統統", "example": "", "category": "IELTS詞庫"}, {"word": "wield", "type": "verb", "meaning": "揮舞（劍等）；使用（工具等）；行使（權力）；施加（影響）", "example": "", "category": "IELTS詞庫"}, {"word": "wile", "type": "noun", "meaning": "詭計，奸計；騙人的把戲；欺詐行為 / v. 欺騙；誘惑（+away/from/into）；消磨，消遣（+away）", "example": "", "category": "IELTS詞庫"}, {"word": "winsome", "type": "adjective", "meaning": "引人注目的；迷人的；可愛的；快活的", "example": "", "category": "IELTS詞庫"}, {"word": "wintry", "type": "adjective", "meaning": "冬天的；冬天似的；寒冷的，風雪交加的", "example": "", "category": "IELTS詞庫"}, {"word": "wiry", "type": "adjective", "meaning": "金屬線製的；金屬絲般的；堅硬的；韌的", "example": "", "category": "IELTS詞庫"}, {"word": "witchcraft", "type": "noun", "meaning": "巫術，魔法；魔力；魅力", "example": "", "category": "IELTS詞庫"}, {"word": "witless", "type": "adjective", "meaning": "不明事理的；愚笨的；發瘋的", "example": "", "category": "IELTS詞庫"}, {"word": "witling", "type": "noun", "meaning": "假作聰明的人", "example": "", "category": "IELTS詞庫"}, {"word": "witticism", "type": "noun", "meaning": "名言；妙語；俏皮話", "example": "", "category": "IELTS詞庫"}, {"word": "wittingly", "type": "adverb", "meaning": "有意地；存心地", "example": "", "category": "IELTS詞庫"}, {"word": "wizen", "type": "verb", "meaning": "（使）起皺；（使）乾癟", "example": "", "category": "IELTS詞庫"}, {"word": "wizen-faced", "type": "adjective", "meaning": "面孔乾瘦的", "example": "", "category": "IELTS詞庫"}, {"word": "working-man", "type": "noun", "meaning": "有工作的人", "example": "", "category": "IELTS詞庫"}, {"word": "workmanlike", "type": "adjective", "meaning": "技藝平平的；一般水準的、技術純熟的；能工巧匠般的", "example": "", "category": "IELTS詞庫"}, {"word": "workmanship", "type": "noun", "meaning": "技藝；手藝；工藝", "example": "", "category": "IELTS詞庫"}, {"word": "wrangle", "type": "verb", "meaning": "（尤指長時間的）爭論，爭辯", "example": "", "category": "IELTS詞庫"}, {"word": "wreak", "type": "verb", "meaning": "造成，引起（災禍等）", "example": "", "category": "IELTS詞庫"}, {"word": "wrest", "type": "verb", "meaning": "辛苦謀求；費力取得、奪取；攫取", "example": "", "category": "IELTS詞庫"}, {"word": "wretchedness", "type": "noun", "meaning": "不幸，可憐；肮髒，惡劣、病得厲害；非常不快", "example": "", "category": "IELTS詞庫"}, {"word": "writhe", "type": "verb", "meaning": "扭動；蠕動、痛苦不安，難堪", "example": "", "category": "IELTS詞庫"}, {"word": "writing", "type": "noun", "meaning": "筆跡；書法、（書寫或印刷的）文字、文學作品；著作、寫作；創作、（用筆）書寫", "example": "", "category": "IELTS詞庫"}, {"word": "wry", "type": "adjective", "meaning": "諷刺的；解嘲的", "example": "", "category": "IELTS詞庫"}, {"word": "yearling", "type": "noun", "meaning": "一歲；滿一歲的動物；一歲馬 / adj. 一歲的", "example": "", "category": "IELTS詞庫"}, {"word": "zealot", "type": "noun", "meaning": "狂熱者；熱心者", "example": "", "category": "IELTS詞庫"}, {"word": "zeitgeist", "type": "noun", "meaning": "（某一特定歷史時期的）時代思潮，時代精神", "example": "", "category": "IELTS詞庫"}, {"word": "zenith", "type": "noun", "meaning": "頂峰；鼎盛時期", "example": "", "category": "IELTS詞庫"}, {"word": "zephyr", "type": "noun", "meaning": "和風，微風", "example": "", "category": "IELTS詞庫"}, {"word": "zodiac", "type": "noun", "meaning": "黃道十二宮(圖)", "example": "", "category": "IELTS詞庫"}];
    const CATEGORIES = ['全部', '學術通用', '環境', '科技', '教育', '健康', '社會', 'IELTS詞庫'];

    let filtered = [];
    let currentMode = 'list';
    let currentFilter = '全部';
    let currentPage = 1;
    let starred = new Set(JSON.parse(localStorage.getItem('ielts_starred') || '[]'));
    let cardIndex = 0;
    let cardPool = [];
    let searchTimer = null;

    document.getElementById('total-subtitle').textContent =
      '共 ' + ALL_WORDS.length + ' 個單字，依主題分類，支援搜尋與單字卡練習。';

    function buildFilters() {
      document.getElementById('filter-btns').innerHTML = CATEGORIES.map(cat =>
        '<button class="filter-btn ' + (cat === '全部' ? 'active' : '') + '" onclick="setFilter(\'' + cat + '\',this)">' + cat + '</button>'
      ).join('');
    }

    function setFilter(cat, btn) {
      currentFilter = cat;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentPage = 1;
      applyFilter();
    }

    function onSearch() {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => { currentPage = 1; applyFilter(); }, 200);
    }

    function applyFilter() {
      const query = (document.getElementById('search-input').value || '').toLowerCase().trim();
      filtered = ALL_WORDS.filter(w => {
        const matchCat = currentFilter === '全部' || w.category === currentFilter;
        const matchQ = !query || w.word.toLowerCase().includes(query) || w.meaning.includes(query);
        return matchCat && matchQ;
      });
      document.getElementById('stats-bar').innerHTML =
        '顯示 <span>' + filtered.length + '</span> 個單字（共 ' + ALL_WORDS.length + ' 個）';
      renderPage();
    }

    function renderPage() {
      const start = (currentPage - 1) * PAGE_SIZE;
      const pageWords = filtered.slice(start, start + PAGE_SIZE);
      const list = document.getElementById('vocab-list');
      if (filtered.length === 0) {
        list.innerHTML = '<div class="empty-msg">找不到符合的單字</div>';
        document.getElementById('pagination').innerHTML = '';
        return;
      }
      list.innerHTML = pageWords.map(w => {
        const isStarred = starred.has(w.word);
        const wordSafe = w.word.replace(/'/g, "\\'");
        return '<div class="vocab-item">' +
          '<div class="vocab-main">' +
          '<div class="vocab-word">' + w.word + '</div>' +
          '<span class="vocab-type">' + w.type + '</span>' +
          '<div class="vocab-meaning">' + w.meaning + '</div>' +
          (w.example ? '<div class="vocab-example">"' + w.example + '"</div>' : '') +
          '</div>' +
          '<span class="vocab-category-tag">' + w.category + '</span>' +
          '<button class="star-btn ' + (isStarred ? 'starred' : '') + '" onclick="toggleStar(\'' + wordSafe + '\',this)">' +
          (isStarred ? '⭐' : '☆') + '</button></div>';
      }).join('');
      renderPagination();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderPagination() {
      const totalPages = Math.ceil(filtered.length / PAGE_SIZE);
      if (totalPages <= 1) { document.getElementById('pagination').innerHTML = ''; return; }
      let html = '<button class="page-btn" onclick="goPage(' + (currentPage-1) + ')" ' + (currentPage===1?'disabled':'') + '>‹ 上一頁</button>';
      const pages = [];
      for (let i = 1; i <= totalPages; i++) {
        if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) pages.push(i);
      }
      let prev = null;
      for (const p of pages) {
        if (prev && p - prev > 1) html += '<span class="page-info">…</span>';
        html += '<button class="page-btn ' + (p===currentPage?'active':'') + '" onclick="goPage(' + p + ')">' + p + '</button>';
        prev = p;
      }
      html += '<button class="page-btn" onclick="goPage(' + (currentPage+1) + ')" ' + (currentPage===totalPages?'disabled':'') + '>下一頁 ›</button>';
      document.getElementById('pagination').innerHTML = html;
    }

    function goPage(p) {
      const totalPages = Math.ceil(filtered.length / PAGE_SIZE);
      if (p < 1 || p > totalPages) return;
      currentPage = p;
      renderPage();
    }

    function toggleStar(word, btn) {
      if (starred.has(word)) { starred.delete(word); btn.classList.remove('starred'); btn.textContent = '☆'; }
      else { starred.add(word); btn.classList.add('starred'); btn.textContent = '⭐'; }
      localStorage.setItem('ielts_starred', JSON.stringify([...starred]));
    }

    function initCards() {
      cardPool = currentMode === 'starred'
        ? ALL_WORDS.filter(w => starred.has(w.word))
        : [...filtered];
      cardIndex = 0;
      initAccentButtons();
      showCard();
    }

    function showCard() {
      if (cardPool.length === 0) {
        document.getElementById('card-word').textContent = '沒有單字';
        document.getElementById('card-counter').textContent = '0 / 0';
        document.getElementById('card-progress-fill').style.width = '0%';
        return;
      }
      const w = cardPool[cardIndex];
      document.getElementById('card-word').textContent = w.word;
      document.getElementById('card-phonetic').textContent = '';
      document.getElementById('card-type').textContent = w.type;
      document.getElementById('card-meaning').textContent = w.meaning;
      document.getElementById('card-example').textContent = w.example ? '"' + w.example + '"' : '';
      document.getElementById('flashcard').classList.remove('flipped');
      document.getElementById('card-counter').textContent = (cardIndex+1) + ' / ' + cardPool.length;
      document.getElementById('card-progress-fill').style.width = Math.round(((cardIndex+1)/cardPool.length)*100) + '%';
    }

    let speechEnabled = true;
    let accentLang = localStorage.getItem('ielts_accent') || 'en-GB';
    const pronunciationCache = {};

    function setAccent(lang, btn) {
      accentLang = lang;
      localStorage.setItem('ielts_accent', lang);
      document.querySelectorAll('.accent-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (cardPool[cardIndex]) fetchAndPlay(cardPool[cardIndex].word);
    }

    function initAccentButtons() {
      document.querySelectorAll('.accent-btn').forEach(btn => {
        const lang = btn.getAttribute('onclick').match(/'(en-\w+)'/)[1];
        btn.classList.toggle('active', lang === accentLang);
      });
    }

    function toggleSpeech() {
      speechEnabled = !speechEnabled;
      document.getElementById('speech-toggle').textContent = '🔊 朗讀：' + (speechEnabled ? '開' : '關');
    }

    function speakWord(word) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(word);
      u.lang = accentLang; u.rate = 0.9;
      window.speechSynthesis.speak(u);
    }

    async function fetchAndPlay(word) {
      if (!speechEnabled) return;
      const cacheKey = word + '|' + accentLang;
      if (pronunciationCache[cacheKey]) {
        playAudio(pronunciationCache[cacheKey].audio, pronunciationCache[cacheKey].phonetic, word);
        return;
      }
      try {
        const res = await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(word));
        if (!res.ok) throw new Error();
        const data = await res.json();
        const entry = data[0];
        const phonetics = entry.phonetics || [];
        const preferUK = accentLang !== 'en-US';
        const preferred = preferUK ? 'uk' : 'us';
        const fallback  = preferUK ? 'us' : 'uk';
        const pick = (k) => phonetics.find(p => p.audio && p.audio.includes(k));
        const chosen = pick(preferred) || pick(fallback) || phonetics.find(p => p.audio) || {};
        const phonetic = (phonetics.find(p => p.text) || {}).text || entry.phonetic || '';
        pronunciationCache[cacheKey] = { audio: chosen.audio || '', phonetic };
        playAudio(chosen.audio || '', phonetic, word);
      } catch(e) {
        speakWord(word);
      }
    }

    function playAudio(url, phonetic, fallbackWord) {
      const el = document.getElementById('card-phonetic');
      if (el && phonetic) el.textContent = phonetic;
      if (url) {
        const a = new Audio(url);
        a.play().catch(() => speakWord(fallbackWord));
      } else {
        speakWord(fallbackWord);
      }
    }
    function flipCard() {
      document.getElementById('flashcard').classList.toggle('flipped');
    }
    function nextCard() { if (cardIndex < cardPool.length-1) { cardIndex++; showCard(); } }
    function prevCard() { if (cardIndex > 0) { cardIndex--; showCard(); } }
    function shuffleCards() {
      for (let i = cardPool.length-1; i > 0; i--) {
        const j = Math.floor(Math.random()*(i+1));
        [cardPool[i], cardPool[j]] = [cardPool[j], cardPool[i]];
      }
      cardIndex = 0; showCard();
    }

    function switchMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-btn').forEach((b,i) => {
        b.classList.toggle('active', ['list','card','starred','spell','errors'][i] === mode);
      });
      document.getElementById('list-view').style.display = mode === 'list' ? '' : 'none';
      document.getElementById('card-view').style.display = (mode === 'card' || mode === 'starred') ? 'block' : 'none';
      document.getElementById('spell-view').style.display = mode === 'spell' ? '' : 'none';
      document.getElementById('errors-view').style.display = mode === 'errors' ? '' : 'none';
      document.getElementById('toolbar').style.display = mode === 'list' ? '' : 'none';
      if (mode === 'card' || mode === 'starred') initCards();
      if (mode === 'spell') initSpell();
      if (mode === 'errors') renderErrors();
    }

    document.addEventListener('keydown', e => {
      if (currentMode !== 'card' && currentMode !== 'starred') return;
      if (e.key === 'ArrowRight') nextCard();
      if (e.key === 'ArrowLeft') prevCard();
      if (e.key === ' ') { e.preventDefault(); flipCard(); }
    });

    // Spell test
    let spellPool = [];
    let spellFullPool = [];
    let spellIndex = 0;
    let spellScore = 0;
    let spellAnswered = false;
    let spellQty = 30;
    let practicedWords = new Set(JSON.parse(localStorage.getItem('ielts_practiced') || '[]'));
    let errorWords = new Set(JSON.parse(localStorage.getItem('ielts_errors') || '[]'));

    function setQty(n) {
      spellQty = n;
      document.querySelectorAll('.qty-btn').forEach(b => {
        const val = b.textContent === '全部' ? 0 : parseInt(b.textContent);
        b.classList.toggle('active', val === n);
      });
    }

    function getSpellSource() {
      if (currentMode === 'errors') return ALL_WORDS.filter(w => errorWords.has(w.word));
      if (currentMode === 'starred') return ALL_WORDS.filter(w => starred.has(w.word));
      return currentFilter === '全部' ? ALL_WORDS : ALL_WORDS.filter(w => w.category === currentFilter);
    }

    function initSpell() {
      spellFullPool = getSpellSource();
      const remaining = spellFullPool.filter(w => !practicedWords.has(w.word));
      const info = document.getElementById('spell-remaining-info');
      if (remaining.length === 0) {
        info.innerHTML = '🎉 這個分類全部練完了！點下方按鈕重新開始。';
        info.style.color = '#1a6630';
      } else {
        info.innerHTML = '剩餘未練：<strong style="color:#1a3c5e;">' + remaining.length + '</strong> 個 / 共 ' + spellFullPool.length + ' 個';
        info.style.color = '#888';
      }
      document.getElementById('spell-setup').style.display = '';
      document.getElementById('spell-card').style.display = 'none';
      document.getElementById('spell-input-wrap').style.display = 'none';
      document.getElementById('spell-feedback').style.display = 'none';
      document.getElementById('spell-controls').style.display = 'none';
      document.getElementById('spell-score-box').style.display = 'none';
      document.getElementById('spell-counter').textContent = '';
      document.getElementById('spell-progress-fill').style.width = '0%';
    }

    function startSpell() {
      spellFullPool = getSpellSource();
      let remaining = spellFullPool.filter(w => !practicedWords.has(w.word));
      // If all practiced, auto reset for this session
      if (remaining.length === 0) remaining = [...spellFullPool];
      const shuffled = remaining.sort(() => Math.random() - 0.5);
      spellPool = spellQty === 0 ? shuffled : shuffled.slice(0, Math.min(spellQty, shuffled.length));
      spellIndex = 0; spellScore = 0; spellAnswered = false;
      document.getElementById('spell-setup').style.display = 'none';
      document.getElementById('spell-card').style.display = '';
      document.getElementById('spell-input-wrap').style.display = '';
      document.getElementById('spell-feedback').style.display = '';
      document.getElementById('spell-controls').style.display = 'flex';
      document.getElementById('spell-score-box').style.display = 'none';
      showSpellCard();
    }

    function showSpellCard() {
      if (spellIndex >= spellPool.length) { showSpellResult(); return; }
      const w = spellPool[spellIndex];
      document.getElementById('spell-meaning').textContent = w.meaning;
      document.getElementById('spell-type').textContent = w.type;
      document.getElementById('spell-hint').textContent = w.example ? '"' + w.example + '"' : '';
      const inp = document.getElementById('spell-input');
      inp.value = ''; inp.className = ''; inp.focus();
      document.getElementById('spell-feedback').innerHTML = '';
      spellAnswered = false;
      document.getElementById('spell-counter').textContent = (spellIndex+1) + ' / ' + spellPool.length + '　答對：' + spellScore;
      document.getElementById('spell-progress-fill').style.width = Math.round((spellIndex/spellPool.length)*100) + '%';
    }

    function checkSpell() {
      if (spellAnswered) { spellIndex++; showSpellCard(); return; }
      const w = spellPool[spellIndex];
      const inp = document.getElementById('spell-input');
      const userAns = inp.value.trim().toLowerCase();
      const correct = w.word.toLowerCase();
      if (userAns === correct) {
        inp.className = 'correct';
        document.getElementById('spell-feedback').innerHTML = '<span style="color:#1a6630;font-weight:700;">✓ 正確！</span>';
        spellScore++;
        practicedWords.add(w.word);
        localStorage.setItem('ielts_practiced', JSON.stringify([...practicedWords]));
        incrementDaily();
      } else {
        inp.className = 'wrong';
        document.getElementById('spell-feedback').innerHTML =
          '<span style="color:#b52020;font-weight:700;">✗ 錯誤</span>　正確答案：<strong style="color:#1a3c5e;">' + w.word + '</strong>';
        // add to error words
        errorWords.add(w.word);
        localStorage.setItem('ielts_errors', JSON.stringify([...errorWords]));
      }
      spellAnswered = true;
      document.getElementById('spell-counter').textContent = (spellIndex+1) + ' / ' + spellPool.length + '　答對：' + spellScore;
    }

    function skipSpell() { spellIndex++; showSpellCard(); }

    function shuffleSpell() {
      spellPool.sort(() => Math.random() - 0.5);
      spellIndex = 0; spellScore = 0; spellAnswered = false;
      showSpellCard();
    }

    function showSpellResult() {
      document.getElementById('spell-card').style.display = 'none';
      document.getElementById('spell-input-wrap').style.display = 'none';
      document.getElementById('spell-feedback').style.display = 'none';
      document.getElementById('spell-controls').style.display = 'none';
      document.getElementById('spell-counter').textContent = '';
      document.getElementById('spell-progress-fill').style.width = '100%';
      document.getElementById('spell-final-score').textContent = spellScore + ' / ' + spellPool.length;
      const source = getSpellSource();
      const leftCount = source.filter(w => !practicedWords.has(w.word)).length;
      const msg = document.getElementById('spell-remaining-msg');
      if (leftCount === 0) {
        msg.textContent = '🎉 全部單字都練完了！';
      } else {
        msg.textContent = '還剩 ' + leftCount + ' 個單字未練習';
      }
      document.getElementById('spell-score-box').style.display = 'block';
    }

    function restartSpell() { initSpell(); }

    function resetSpellProgress() {
      if (!confirm('確定要重置練習紀錄嗎？所有單字都會重新標記為未練習。')) return;
      practicedWords.clear();
      localStorage.removeItem('ielts_practiced');
      initSpell();
    }

    // Daily goal
    let dailyGoal = parseInt(localStorage.getItem('ielts_daily_goal') || '20');
    const todayKey = 'ielts_today_' + new Date().toISOString().slice(0,10);
    let todayCount = parseInt(localStorage.getItem(todayKey) || '0');

    function saveDailyGoal() {
      dailyGoal = parseInt(document.getElementById('daily-goal-select').value);
      localStorage.setItem('ielts_daily_goal', dailyGoal);
      updateDailyBar();
    }

    function updateDailyBar() {
      const pct = Math.min(100, Math.round((todayCount / dailyGoal) * 100));
      document.getElementById('daily-progress-fill').style.width = pct + '%';
      document.getElementById('daily-count-label').textContent = todayCount + ' / ' + dailyGoal + ' 個';
      document.getElementById('daily-done-badge').style.display = todayCount >= dailyGoal ? '' : 'none';
      // sync select
      const sel = document.getElementById('daily-goal-select');
      if (sel) sel.value = dailyGoal;
    }

    function incrementDaily() {
      todayCount++;
      localStorage.setItem(todayKey, todayCount);
      updateDailyBar();
    }

    // Call incrementDaily when a word is spelled correctly
    updateDailyBar();

    function renderErrors() {
      const words = ALL_WORDS.filter(w => errorWords.has(w.word));
      document.getElementById('error-count').textContent = '共 ' + words.length + ' 個答錯的單字';
      if (words.length === 0) {
        document.getElementById('errors-list').innerHTML = '<div class="empty-msg">還沒有答錯的單字，繼續加油！</div>';
        return;
      }
      document.getElementById('errors-list').innerHTML = words.map(w => {
        const wordSafe = w.word.replace(/'/g, "\'");
        return '<div class="vocab-item">' +
          '<div class="vocab-main">' +
          '<div class="vocab-word">' + w.word + '</div>' +
          '<span class="vocab-type">' + w.type + '</span>' +
          '<div class="vocab-meaning">' + w.meaning + '</div>' +
          (w.example ? '<div class="vocab-example">"' + w.example + '"</div>' : '') +
          '</div>' +
          '<button class="btn btn-secondary" style="font-size:12px;padding:6px 12px;white-space:nowrap;" onclick="removeError(\'' + wordSafe + '\')">移除</button>' +
          '</div>';
      }).join('');
    }

    function removeError(word) {
      errorWords.delete(word);
      localStorage.setItem('ielts_errors', JSON.stringify([...errorWords]));
      renderErrors();
    }

    function clearErrors() {
      if (!confirm('確定清除所有錯誤單字記錄？')) return;
      errorWords.clear();
      localStorage.removeItem('ielts_errors');
      renderErrors();
    }

    buildFilters();
    applyFilter();
    switchMode('list');

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
  </script>
</body>
</html>
